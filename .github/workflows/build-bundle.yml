# Build the bundle with the newest FEX, the newest Edge stable, and the
# newest Chrome for Testing, and attach it to a release.
#
# The flow: publish a release (a draft is fine), and this workflow builds
# the bundle from the latest upstream versions and uploads
# edge-arm-bridge.tar.gz and it's sha256 to that release. Publishing the
# release after the build is the tidy order, since edge-arm-bridge.sh
# --install always pulls the newest published release and expects the
# bundle asset to be there. A manual dispatch against an existing tag
# rebuilds and replaces that release's bundle, which is how v0.1.0 was
# refreshed.
#
# All of the build logic lives in packaging/build-bundle.sh, tested on
# the VENTUNO Q. This file only sets up the runner and calls it.
name: build-bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the bundle to"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
      - name: Install build tools and add the FEX PPA for download only
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common squashfs-tools patchelf curl unzip python3 clang zlib1g-dev
          sudo add-apt-repository -y ppa:fex-emu/fex
          sudo apt-get update
      - name: Build the bundle
        run: bash packaging/build-bundle.sh
      - name: Upload the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          gh release upload "$TAG" build/edge-arm-bridge.tar.gz build/edge-arm-bridge.tar.gz.sha256 edge-arm-bridge.sh --clobber
