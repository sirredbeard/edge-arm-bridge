# Rebuild the bundle with the newest FEX, Edge stable, and Chrome for
# Testing, and publish it as a release asset.
#
# Status: scaffold. The steps mirror packaging/build-bundle.sh, which is
# tested on the VENTUNO Q. The workflow itself has not run in CI yet, and
# the first runs should be manual dispatches watched by a human.
name: build-bundle

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:17 UTC. Edge and Chrome ship on roughly a four week
    # cycle, so weekly is often a no-change rebuild. The version check in
    # build-bundle.sh keeps the majors paired either way.
    - cron: "17 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
      - name: Add the FEX PPA for download only
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:fex-emu/fex
          sudo apt-get update
      - name: Build the bundle
        run: ./packaging/build-bundle.sh
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: edge-arm-bridge-bundle
          path: |
            build/edge-arm-bridge.tar.gz
            build/edge-arm-bridge.tar.gz.sha256
      - name: Attach to a release when dispatched on a tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/edge-arm-bridge.tar.gz
            build/edge-arm-bridge.tar.gz.sha256
